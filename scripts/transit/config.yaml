# ── Per-zoom-level visibility rules ──────────────────────────────────────────
# See .claude/concepts/zoom-level-rules.md.
# Per-feature integer `min_zoom` (4–12) computed from per-mode line / stop
# rules, a geometric salience score (linear-falloff competition density),
# and a stop-weighted average over the MBST path that pulls isolated
# branches forward to connect to the base network.
zoom_level_rules:
  # Comma-separated route_short_name prefixes treated as intercity at the
  # train z4 rule. Match is "ref starts with this prefix" (case-insensitive).
  intercity_route_prefixes: [IC, ICE, EC]

  # Salience: how alone a line is geographically.
  salience:
    # Spacing of sample points along the polyline (m). The per-sample
    # competition score is averaged across all samples, so a long line in
    # quiet country averages to the same value as a short line in quiet
    # country.
    sample_step_m: 1000
    # Per-mode radius (m) within which other lines (in the mode's
    # comparator set, see comparators below) contribute to competition.
    # Each match contributes 1 − distance / radius (linear falloff).
    radius_m:
      train:        30000
      regional_bus: 10000
      metro:         5000
      tram:          5000
      bus:           5000
      ferry:        10000
      mountain:      5000
    # Per-mode comparator sets — which modes count as competition. A line
    # only competes against modes in its comparator set; this prevents
    # (e.g.) bus density from suppressing trains.
    comparators:
      train:        [train]
      metro:        [metro, train]
      tram:         [tram, metro, train]
      bus:          [bus, tram, metro, train]
      regional_bus: [regional_bus, bus, tram, metro, train]
      ferry:        [ferry]
      mountain:     [mountain]

  # Line graph (super-UIC clustering + MBST).
  line_graph:
    # Stops within this Euclidean distance merge into one line-graph node
    # (super-UIC) regardless of parent_station — catches transfer points
    # that don't share a GTFS parent.
    cluster_threshold_m: 250

  # Stop importance score (points-based, 4 categories summed).
  stop_importance:
    # Radius for the "Nearby transit" category. Counts distinct bus / tram
    # line_keys with ≥ 1 stop within this radius of a train stop,
    # excluding lines that also serve the train stop itself. Train stops
    # only; non-train stops always score 0 in this category.
    nearby_transit_radius_m: 1000

  # Urbanness bracket — OSM building density around each canonical UIC.
  # Two `building=*` counts are taken: within `radius_inner_m` (c200) and
  # within `radius_outer_m` (c500). Bracket assigned by evaluating rules
  # top-to-bottom; first match wins.
  urbanness:
    radius_inner_m: 200
    radius_outer_m: 500
    # Thresholds for elseif-style assignment:
    #   c500 > city_c500              → city
    #   else if c500 > town_c500      → town
    #   else if c200 > village_c200   → village
    #   else                          → rural
    city_c500:    600
    town_c500:    300
    village_c200:  30

# ── Pfaedle invocation ───────────────────────────────────────────────────────
pfaedle:
  # Docker image tag built from scripts/transit/pfaedle/Dockerfile.
  image: "carfree-pfaedle:latest"
  # Modes pfaedle should route. All transit modes go through pfaedle; the
  # straight-line fallback in step 06 is reserved for aerial route_types
  # (cable car / gondola) where OSM coverage is patchier and a missing shape
  # is acceptable. Tokens are pfaedle's own mode names (`pfaedle --help`).
  modes:
    - tram
    - subway
    - rail
    - bus
    - ferry
    - funicular
    - cablecar
    - gondola
  # Cost (seconds per meter) of moving a stop's matched edge away from its
  # GTFS coord. Pfaedle's default of 0.0039 is too low at terminal stops on a
  # oneway curb: it prefers a closer-but-wrong snap on a routable way over the
  # longer-but-correct legal route (Bern Bahnhof platform H on bus 21 outbound
  # is the canonical case — the legal loop south to exit then north adds
  # ~100 m of travel, vs. ~22 m of snap distance to the bidirectional main road
  # which wins at the default factor). Boosting weights snap distance more
  # heavily so closer-to-the-platform snaps win even when they require a
  # longer legal path. Passed to pfaedle via -P at runtime.
  station_move_penalty_fac: 0.05
