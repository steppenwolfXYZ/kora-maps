# ── Pfaedle invocation ───────────────────────────────────────────────────────
pfaedle:
  # Docker image tag built from scripts/transit/pfaedle/Dockerfile.
  image: "carfree-pfaedle:latest"
  # Modes pfaedle should route. funicular/gondola/aerial are not routable on
  # the OSM network and bypass pfaedle (straight-line geometry).
  modes:
    - tram
    - subway
    - rail
    - bus
    - ferry
