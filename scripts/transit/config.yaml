# =============================================================================
# Transit Pipeline Configuration
# =============================================================================

# ── Debug ────────────────────────────────────────────────────────────────────
debug:
  # Debug overlay (pill-rendering concept): thin black platform-extent lines,
  # clickable GTFS-coord dots, and thick white max-stab bars. Development-time
  # visual aids — flip to false for production-style rendering. Read by
  # scripts/generate_style.py.
  debug_overlay: false

# ── OSM bbox extract for pfaedle ─────────────────────────────────────────────
# Switzerland bounding box with a small buffer. Pfaedle never routes outside
# this area; trips with any stop outside it are dropped at GTFS preprocessing.
osm_bbox:
  # min_lon, min_lat, max_lon, max_lat (WGS84)
  # CH proper: ~5.96, 45.82, 10.49, 47.81
  # + ~2 km buffer at Swiss latitudes (~0.018° lat, ~0.026° lon)
  min_lon: 5.93
  min_lat: 45.80
  max_lon: 10.52
  max_lat: 47.83

# ── GTFS stop coordinate overrides ───────────────────────────────────────────
# Hand-set coordinates for parent stops whose official GTFS coord sits too far
# from the actual platform for pfaedle to route. The Eiger Express (route 2444)
# at Grindelwald Terminal is the canonical case: GTFS uses the train-station
# centroid, but the V-Bahn boarding gate is ~250 m away across the Terminal
# building — outside pfaedle's snap radius for the Eiger Express OSM way, so
# pfaedle ends up snapping to the closer Männlichenbahn lower-station node,
# fails to route (Männlichenbahn doesn't reach Eigergletscher) and emits a
# 2-vertex straight stub. Coords here are taken from the matching OSM
# aerialway endpoints (way 799042591). Applied at step 04; affects all trips
# referencing the stop_id, but co-using lines (Männlichenbahn GGM, Jungfraubahn
# 65) still snap within radius of their own OSM endpoints from the moved coord.
gtfs_stop_overrides:
  - stop_id: "8505226"   # Grindelwald Terminal → Eiger Express V-Bahn lower station
    lon: 8.0193659
    lat: 46.6243074
  - stop_id: "8507361"   # Eigergletscher → Eiger Express upper station
    lon: 7.9757404
    lat: 46.5754791

# ── GTFS trip overrides ──────────────────────────────────────────────────────
# Routes where every trip should be structurally rewritten before pfaedle runs.
# Currently the only supported action is `split_at_stop`: split each trip at a
# named transfer stop into two new trips so a service running on two physically
# separate vehicle legs (joined only by a passenger transfer) is drawn as two
# independent lines meeting at the transfer stop. See
# .claude/concepts/gtfs-trip-split-at-stop.md for the requirements; matching is
# (agency_id, route_short_name).
gtfs_trip_overrides:
  - agency_id: "135"            # Niesenbahn AG
    route_short_name: "2405"
    action: split_at_stop
    transfer_stop_id: "8507458" # Schwandegg
    reason: "Two cables, mandatory transfer at Schwandegg; OSM ways are not node-connected, so pfaedle can only route the leg adjacent to the start terminal."

# ── GTFS preprocessing: agency denylists ─────────────────────────────────────
# Both lists key on substrings of agency_name (case-insensitive) as found in
# data/gtfs/agency.txt. Matching is "agency_name contains any of these tokens".

# Long-distance / international coach operators that should not be drawn at all.
# Their trips follow motorways and would visually highlight the road network.
# Ported from the OSM-tag-based EXCLUDED_OPERATORS set used by the old matcher.
excluded_agencies:
  - flixbus
  - flixcoach
  - eurolines
  - deinbus
  - megabus
  - blablacar
  - ouibus
  - ic bus
  - alsa

# ── Mountain agencies ────────────────────────────────────────────────────────
# GTFS agency_ids whose rail lines (extended route_type 100s) render as mountain
# mode (yellow, no freq variance). Listed agencies are not freq/active-days
# exempt — they run regular timetables; the rebucketing only changes the visual
# style. The criterion is "agency is outside the GA-Geltungsbereich"; Rigi
# Bahnen (137) is a manual exception (in the GA but unambiguously a tourist
# mountain line). agency_id keys, not name substrings — the substring approach
# previously matched both BOB (valley) and BOB-spb (Schynige Platte) and broke
# the Interlaken–Lauterbrunnen line.
mountain_agency_ids:
  - "157"   # WAB     — Wengernalpbahn
  - "124"   # JB      — Jungfraubahn
  - "121"   # GGB     — Gornergratbahn
  - "137"   # RB      — Rigi Bahnen (GA-included, manual exception)
  - "136"   # PB      — Pilatusbahnen
  - "803"   # VerAlp  — VerticAlp Vallée du Trient
  - "140"   # BOB-spb — BOB Schynige Platte branch
  - "104"   # BRB     — Brienz Rothorn Bahn
  - "129"   # MG      — Ferrovia Monte Generoso
  - "160"   # DFB     — Dampfbahn Furka-Bergstrecke

# ── Pill rendering: per-mode platform length defaults and sanity ranges ─────
# See .claude/concepts/pill-rendering.md.
# `default_length_m` applies when atlas has no length for the stop (always for
# tram/bus/regional_bus; rare for train/metro). `sanity_min_m` / `sanity_max_m`
# clip atlas values: anything outside the range falls through to the default
# — catches 0 m placeholders and km-scale ferry-route mislabels.
pill_rendering:
  default_length_m:
    train:              100
    metro:               60
    tram:                35
    bus:                 30
    regional_bus:        30
    mountain_rail:      100   # mountain_origin in {rebucketed_rail, rack}
    mountain_funicular:  25
  sanity_min_m:
    train:               30
    metro:               30
    tram:                10
    bus:                  5
    regional_bus:         5
    mountain_rail:       30
    mountain_funicular:  10
  sanity_max_m:
    train:              700
    metro:              400
    tram:               100
    bus:                100
    regional_bus:       100
    mountain_rail:      700
    mountain_funicular:  60
  perp_platform_tol_deg: 5.0
  # ── Rail-only missing-range fill (terminal train stops) ─────────────────
  # See pill-rendering concept § "Missing-range fill (rail only)". When the
  # pfaedle polyline ends at the platform centre (terminal train stop), step 07
  # walks an OSM rail way under the snap point to produce the missing-side
  # extent + line extension. Fallback A (no matching way) uses a capped
  # straight extrapolation. Fallback B (way runs out) treats the stop as
  # end-of-platform — extent absorbs full L on the polyline side, no line
  # extension.
  osm_match_radius_m: 5.0
  osm_match_max_tangent_diff_deg: 15.0
  osm_fallback_max_straight_m: 50.0

# ── Pill design bands ───────────────────────────────────────────────────────
# Three baked variants of the pill / connector layout, one per zoom band.
# See pill-rendering.md § "Pills and connectors" and § "Connector curving".
# Each band re-runs the pill construction with its own pill_gap_angled_m
# and curve_min_radius_m. Features carry `design_band` and per-feature
# tippecanoe.minzoom / tippecanoe.maxzoom limiting them to their band's
# zoom range. `zoom_max: null` on band C means no maxzoom (pill layers
# stay visible at every zoom above z16 for inspection).
pill_design_bands:
  A:
    zoom_min: 14
    zoom_max: 14
    pill_gap_straight_m: 100
    pill_gap_angled_m: 60
    curve_min_radius_m: 15
    dedup_tol_m: 5.0            # ~0.75 px at z14; collapse sub-pixel twins
    pill_simplify_tol_m: 4.0    # flatten sub-pixel detours in the polyline
    pill_min_d_px: 4.5          # for pill-diameter-aware kink removal
    pill_slope_px_per_wb: 2.3
  B:
    zoom_min: 15
    zoom_max: 15
    pill_gap_straight_m: 75
    pill_gap_angled_m: 30
    curve_min_radius_m: 10
    dedup_tol_m: 2.5
    pill_simplify_tol_m: 3.0
    pill_min_d_px: 6.0
    pill_slope_px_per_wb: 3.2
  C:
    zoom_min: 16
    zoom_max: null
    pill_gap_straight_m: 50
    pill_gap_angled_m: 15
    curve_min_radius_m: 5
    dedup_tol_m: 0.5
    pill_simplify_tol_m: 0.1
    pill_min_d_px: 8.0
    pill_slope_px_per_wb: 4.4

# ── Ferry stop rendering ────────────────────────────────────────────────────
# Ferries don't get pills (no platform). Instead each parent_station emits:
# a big white dot at the canonical on-line snap, and — if the GTFS coord sits
# more than `collapse_threshold_m` from the snap — a second dot at the GTFS
# coord plus a short connector between the two. The pier itself is poorly
# drawn in basemap tiles, so the connector visually bridges land→boarding
# point. The canonical snap is the medoid of each ferry line's individual
# snap onto its own polyline (so all lines at the pier share one stop disc).
#
# `dot_width_base` is a fixed visual size, NOT a freq-derived value — every
# ferry stop dot renders at the same diameter regardless of how thick the
# ferry line is (typical ferry line widths are clustered near the floor).
# 2.5 matches the median train-stop dot diameter.
# `connector_width_base` drives the connector's line-width via the standard
# pill connector curve; 1.0 keeps it visibly thinner than the dot.
# `collapse_threshold_m` is the GTFS↔snap distance below which the GTFS-side
# dot and connector are suppressed and only the snap dot is drawn.
ferry_stops:
  dot_width_base:          2.5
  connector_width_base:    1.0
  collapse_threshold_m:    15
  # Max allowed distance from the canonical pier vertex (medoid of each
  # line's closest polyline vertex to the GTFS coord) to any other line's
  # pier vertex. Above this, the parent_station bundles physically
  # separate berths — the renderer falls back to one dot per line at each
  # line's individual GTFS snap (no shared canonical disc, no connector).
  # Spiez-style fans where 16 of 20 lines share one OSM node and the
  # other 4 sit at a terminal node ~17 m away stay under 20 m.
  convergence_threshold_m: 20
  # Pier endpoint pull. Pfaedle sometimes routes a ferry polyline past
  # the actual dock to an OSM ferry node a bit further from the GTFS
  # coord, leaving an intermediate routing vertex closer than the
  # endpoint. The closest-vertex / closest-point pick then lands
  # mid-polyline in the water (e.g. line 3150 at Lausanne-Ouchy, where
  # the last vertex sits ~50 m north of vertex [n-1]). When the closer
  # polyline endpoint is within this distance of the initial pick, snap
  # to the endpoint instead — the polyline's terminus is by construction
  # the OSM ferry-pier node pfaedle routed to, i.e. the physical dock.
  # Applies to both the canonical-pier closest-vertex pick and the
  # per-line snap. Wide enough to cover Lausanne's 50.7 m offset.
  endpoint_pull_threshold_m: 75

# ── Far-zoom stop-marker placement ───────────────────────────────────────────
# Far-zoom dot positioning for non-rail clusters (metro, tram, bus,
# regional_bus, ferry). At a crossroads the dot should sit at the service
# node — where the lines actually meet — not at the platform centroid.
# See .claude/concepts/far-zoom-stop-markers.md.
far_zoom_marker:
  # Proximity threshold for counting a line as passing near an intersection
  # candidate point.
  intersection_tol_m:      8

# ── Frequency endpoints per bucket (trips per hour) ──────────────────────────
# Endpoints of the per-bucket frequency score curve. The line's weighted
# frequency (window_weights × per-window trips/hour) is mapped onto [0, 1]:
#   f_weighted >= best_freq → score = 1.0
#   f_weighted <= worst_freq → score = 0.0
# Between the endpoints, the score is computed on a log curve with a power
# applied to bend the mid-range. See
# .claude/concepts/frequency-weighted-line-scoring.md.
# Ferry's worst_freq is intentionally low so seasonal lake services (BAT 74
# Brienz, Thunersee, Walensee, etc.) clear the freq gate. Ferries are NOT
# gate-exempt — 0.010 trips/hour ≈ a line running roughly five trips a week,
# which drops only the lowest-tier lake services.
# Mountain values are informational — mountain is exempt from the freq gate.
# Every bucket appearing in either table must appear in both; a missing entry
# is a fatal config error.
frequency:
  best_freq:
    train:           4.0
    tram:            8.6
    metro:          12.0
    bus:            10.0
    regional_bus:    2.0
    ferry:           1.33
    mountain:        1.0
  worst_freq:
    train:           0.25
    tram:            0.6
    metro:           0.8
    bus:             0.75
    regional_bus:    0.17
    ferry:           0.010
    mountain:        0.05

# ── Per-window weights ───────────────────────────────────────────────────────
# Relative importance of each scoring window for visual line prominence.
# Must sum to 1.0. A line with no service in a window contributes zero from
# that window to the weighted frequency.
window_weights:
  core: 0.6
  eve:  0.2
  we:   0.2

# ── Line width endpoints per bucket ──────────────────────────────────────────
# min: width_base for a line at score = 0 (worst_freq); max: at score = 1
# (best_freq). Train is set wider than other modes. Mountain has min = max
# (fixed width regardless of score) — mountain is colored/sized by mode, not
# by service level. Every mode that draws must appear; a missing entry is a
# fatal config error.
line_width:
  train:
    min: 2.00
    max: 5.00
  tram:
    min: 0.70
    max: 3.00
  metro:
    min: 1.00
    max: 3.00
  bus:
    min: 0.70
    max: 2.50
  regional_bus:
    min: 1.00
    max: 2.00
  ferry:
    min: 1.00
    max: 2.50
  mountain:
    min: 1.50
    max: 2.50

# ── Far-zoom stop dot sizing ─────────────────────────────────────────────────
# Per-stop tier assignment used to size dots at zooms 7–z13.99. See
# `.claude/concepts/far-zoom-stop-dot-redesign.md`. The score itself does not
# drive size — it feeds the tier assignment (top-down first-match). Each tier
# has a fixed z7 / z13 diameter; the size interpolates linearly with zoom
# between those corners. Tier is assigned once per UIC in step 06.
#
# `mode_weights`, `train_class_weights`, and `terminal_multiplier` drive the
# per-line contribution formula (see the concept doc). The score is
# aggregated at the parent UIC and stored on every dot in that UIC.
stop_dot_sizing:
  mode_weights:
    bus:           1.0
    regional_bus:  1.0
    tram:          1.5
    metro:         2.0
    train:         3.0
    mountain:      3.0
    ferry:         3.0
  # Train class weights: absolute weight overrides for `mode == train`
  # based on the line's `ref`. When a train feature's `ref` matches one
  # of these prefixes, the class weight REPLACES `mode_weights.train`
  # (not multiplied) — so an IC contribution lands at exactly 6 × (1 +
  # freq_score), not at `train_weight × multiplier`. S-Bahn / other
  # trains that don't match any class fall back to `mode_weights.train`.
  #
  # Resolution order: IC prefixes → IR → RE → single-letter "R" (where
  # the character after R is a digit / space / end, so RJ and RB don't
  # fall into the RE/R bucket).
  #
  # IC prefixes come from `zoom_level_rules.intercity_route_prefixes`
  # (currently IC / ICE / EC).
  train_class_weights:
    ic: 6.0    # IC / ICE / EC
    ir: 5.0    # IR
    re: 4.0    # RE or bare-R lines
  # Terminal multiplier: applied when the stop is the first OR last entry
  # in a feature's stop sequence (the feature terminates at this stop in
  # this direction). Mid-line passthroughs use 1.0. The boost compensates
  # for terminal arrivals normally being silently dropped (a line that
  # ends here still represents a real service relation) and lifts
  # endpoints over through-stops in the same line's score.
  terminal_multiplier: 1.5

  # Score thresholds and mountain-line-count threshold used by the tier
  # assignment. See the concept § "Tier assignment". Rules are evaluated
  # top-down; the first match wins (train family → mountain → ferry →
  # tram/bus). Change these to move tier boundaries without a data-only
  # rebuild — updating a threshold requires `--start 6` because the tier
  # is baked into the feature.
  tier_thresholds:
    major_train:      100   # IC line + score >= this → major_train
    main_train:        40   # IC line + score >= this → main_train
    important_train:   20   # any train + score >= this → important_train
    train_station:     10   # any train + score >= this → train_station
    major_mountain:     2.0 # mountain_line_count >= this → major_mountain
    major_hub:         15   # score >= this (no train/mountain/ferry) → major_hub
    big_station:        6
    normal_stop:        1.5

  # Mountain-line-count weighting (Major-vs-regular mountain check only).
  # A stop's mountain_line_count sums the per-line values below across
  # its own base line composition. Train lines don't participate — a
  # stop with any train line is already in a train tier.
  mountain_line_count:
    mountain_through: 1.0   # non-terminating mountain line
    mountain_term:    0.9   # terminating mountain line
    ferry:            1.0   # ferry (always)
    tram_bus:         0.5   # tram / bus / regional_bus (each)

  # Optional per-UIC tier overrides for hand-fixed edge cases. Each entry
  # forces the listed UIC into a specific tier regardless of the
  # score / composition rules. Not expected to be heavily used.
  tier_overrides: []
  # - uic: "8500010"
  #   tier: main_train
  #   reason: "Example: force Basel-Kleinhüningen into main_train"

  # Per-tier fixed diameters (CSS pixels) at z7 and z13. Within a tier
  # there is no per-stop size variation. Linear interpolate between the
  # corners for intermediate zooms; clamped past either edge. Diameter
  # tweaks here are style-only: after editing, re-run
  # `python3 scripts/generate_style.py` and reload.
  tier_sizes:
    major_train:      { z7: 7,   z13: 18 }
    main_train:       { z7: 6.5, z13: 15 }
    important_train:  { z7: 6,   z13: 13 }
    train_station:    { z7: 5,   z13: 11 }
    small_train:      { z7: 4,   z13: 9 }
    major_mountain:   { z7: 3,   z13: 6 }
    mountain_stop:    { z7: 2.5, z13: 5 }
    ferry_stop:       { z7: 3,   z13: 6 }
    major_hub:        { z7: 4.5,   z13: 10 }
    big_station:      { z7: 3.5, z13: 7.5 }
    normal_stop:      { z7: 2.5, z13: 5.5 }
    small_bus:        { z7: 2,   z13: 4 }

# ── Far-zoom dot dedup ───────────────────────────────────────────────────────
# At each far-zoom level (z7–z13), overlapping dot pairs are merged. Mode
# hierarchy gates the absorber side first: `train` outranks `mountain` /
# `ferry`, which outrank everything else. Within the same rank the
# higher-score dot absorbs the lower; across ranks a strictly higher-ranked
# dot absorbs a lower-ranked neighbour regardless of score. Absorption is
# visual only — the absorber's tier and size stay fixed; only its per-zoom
# popup line list grows. See `.claude/concepts/far-zoom-stop-dot-redesign.md`
# § "Dedup of overlapping dots". `min_spacing_px` is the required edge-to-
# edge clearance between surviving discs. A single value covers all zooms
# since disc sizes already scale with zoom.
stop_dot_dedup:
  min_spacing_px: 0.0

# ── Minimum active days ──────────────────────────────────────────────────────
# A line whose service runs on fewer than this many distinct calendar dates
# across the full feed validity period is dropped. Catches construction-
# replacement bus services (e.g. SVB Bern 3A / 9A) that have year-round
# frequency on the days they do run but only exist for a few weeks.
# Ferry + aerial / funicular mountain are exempt entirely (see _gate_exempt).
# Per-bucket overrides via `min_active_days_by_bucket` — used for buckets where
# seasonal services should still draw (e.g. summer-only rack mountain lines
# like Schynige Platte Bahn or Brienzer Rothorn Bahn).
# Lower the default (e.g. 100) to loosen; raise to tighten.
min_active_days: 150
min_active_days_by_bucket:
  mountain: 90

# Seasonal mountain-feeder branches like Theytaz 372 → Le Chargeur run
# only summer/winter and fall below `min_active_days`. Bus-bucket variants
# at or above this threshold are kept only if they classify as regional_bus
# at emission.
min_active_days_regional_bus: 90

# Unique-stop rescue for rare-variant filter on regional-bus-rescued groups.
# A variant below the 10% share threshold is rescued if it serves a parent
# station unserved by any kept-by-share variant across the dataset AND that
# station is at least `unique_stop_min_distance_m` from any kept-by-share
# stop within the same group AND the variant's weighted-share is at least
# `unique_stop_min_share_pct` in some window.
unique_stop_min_distance_m: 1000
unique_stop_min_share_pct: 0.02

