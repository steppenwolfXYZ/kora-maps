# ── Pfaedle invocation ───────────────────────────────────────────────────────
pfaedle:
  # Docker image tag built from scripts/transit/pfaedle/Dockerfile.
  image: "carfree-pfaedle:latest"
  # Modes pfaedle should route. All transit modes go through pfaedle; the
  # straight-line fallback in step 06 is reserved for aerial route_types
  # (cable car / gondola) where OSM coverage is patchier and a missing shape
  # is acceptable. Tokens are pfaedle's own mode names (`pfaedle --help`).
  modes:
    - tram
    - subway
    - rail
    - bus
    - ferry
    - funicular
    - cablecar
    - gondola
  # Cost (seconds per meter) of moving a stop's matched edge away from its
  # GTFS coord. Pfaedle's default of 0.0039 is too low at terminal stops on a
  # oneway curb: it prefers a closer-but-wrong snap on a routable way over the
  # longer-but-correct legal route (Bern Bahnhof platform H on bus 21 outbound
  # is the canonical case — the legal loop south to exit then north adds
  # ~100 m of travel, vs. ~22 m of snap distance to the bidirectional main road
  # which wins at the default factor). Boosting weights snap distance more
  # heavily so closer-to-the-platform snaps win even when they require a
  # longer legal path. Passed to pfaedle via -P at runtime.
  station_move_penalty_fac: 0.05
