# =============================================================================
# Car-Free Map Style Configuration
# =============================================================================
# High-level design tokens for generating a MapLibre style JSON.
# Edit values here, rerun the generator, refresh the browser.
#
# Color philosophy:
#   Green  = nature (default, background)
#   Warm   = urban, human spaces (buildings, residential zones)
#   Gray   = dead/uninteresting (industry, motorways, inaccessible)
# =============================================================================

# ── Global ───────────────────────────────────────────────────────────────────
global:
  name: "Car-Free Map"
  center: [8.2269, 46.8012]   # geographic center of Switzerland (Älggi-Alp)
  zoom: 8
  min_zoom: 0
  max_zoom: 20
  tile_source: "https://tiles.openfreemap.org/planet"
  tile_source_type: "tilejson"
  glyphs: "/map-assets/fonts/{fontstack}/{range}.pbf"
  sprite: ""

# ── Palette ──────────────────────────────────────────────────────────────────
palette:
  # Background: light cool green — unmapped land is probably nature
  background: "#d6e2ce"

  # Nature (cool green tones)
  water: "#a4c4e0"
  water_outline: "#7dabc8"
  forest: "#a0c8a0"
  park: "#b4d8a4"
  farmland: "#ccdcb8"
  meadow: "#c8d8bc"
  scrub: "#bcceb0"
  wetland: "#a8c8b4"
  glacier: "#e0ecf4"
  bare_rock: "#ccd2c8"
  sand_beach: "#e4dcc0"

  # Urban (warm tones)
  urban_area: "#e6d8c4"
  buildings: "#dabeac"
  building_outline: "#b89990"
  industrial: "#e0d8cf"
  commercial: "#f4d8c0"

  # Infrastructure
  rail: "#ffffff"
  rail_opacity: 0.2
  bridge_casing: "#c4c0b8"
  bridge_deck_opacity: 0.6
  tunnel_opacity: 0.4

  # Labels
  label_color: "#3a3a3a"
  label_halo: "#ffffffcc"
  label_water: "#4a7da8"

# ── Roads ────────────────────────────────────────────────────────────────────
roads:
  motorway:
    fill_color: "#c4c0b8"
    casing_color: "#b0aca4"
    line_color: "#a0a0a0"
    line_dasharray: [4, 3]
    area_min_zoom: 13
    min_zoom: 5

  main_road:
    line_color: "#b0aca4"
    fill_color: "#ccc8c0"
    casing_color: "#b8b4a8"
    area_min_zoom: 14
    min_zoom: 8

  walkable:
    area_min_zoom: 15
    line_min_zoom: 12
    casing_color: "#c08040"
    disappear_zoom: 11

  # Real-world road widths in meters, applied at close zoom
  real_widths:
    motorway: 24    # carriageway + shoulders
    trunk: 18
    primary: 20     # urban arterials often include tram + parking + sidewalks
    secondary: 18   # tree-lined boulevards, tram lines
    tertiary: 12    # main urban street with sidewalks
    residential: 9  # road + sidewalks on both sides
    living_street: 8
    pedestrian: 8   # pedestrian zone — can't distinguish wide shopping street from narrow park path in vector tiles
    service: 4      # driveway / parking aisle
    minor: 9        # same as residential
    track: 4
    min_zoom: 15
    full_zoom: 17

# ── Walkability ──────────────────────────────────────────────────────────────
walkability:
  color_low: "#c08040"
  color_mid: "#c08040"
  color_high: "#c08040"

  scoring_rules:
    - match: { highway: "pedestrian" }
      score: 1.0
    - match: { highway: "living_street" }
      score: 0.85
    - match: { maxspeed_lte: 20 }
      score: 0.80
    - match: { maxspeed_lte: 30 }
      score: 0.65
    - match: { highway: "residential" }
      score: 0.55
    - match: { highway: "unclassified" }
      score: 0.45
    - match: { maxspeed_lte: 50 }
      score: 0.35
    - match: { maxspeed_lte: 60 }
      score: 0.15
    - match: { default: true }
      score: 0.30

  mid_zoom_lines:
    solid_above: 0.75
    semi_dashed_above: 0.45
    dashed_above: 0.15
    width_high: 2.0
    width_mid: 1.5
    width_low: 1.0

# ── Paths & Cycleways ───────────────────────────────────────────────────────
paths:
  color: "#c08040"
  color_unpaved: "#b08050"
  # Pedestrian areas (squares, plazas) arrive as Polygons in the same
  # `class=path` bucket as footway lines. Drawn as a fill, not an outline:
  # a boundary line is indistinguishable from a path and reads as one, which
  # is misleading — the surface is walkable, its edge is not a route.
  # Softer than `color` because a large fill carries far more visual weight
  # than a 1 px line of the same value.
  area_color: "#d6bf9f"
  area_min_zoom: 14
  width: 1.2
  min_zoom: 14
  unpaved_dasharray: [3, 2]
  tunnel_color: "#404040"
  tunnel_width: 6.0
  tunnel_opacity: 0.15

# ── Land use ─────────────────────────────────────────────────────────────────
landuse:
  min_zoom: 4
  opacity_low_zoom: 0.6
  opacity_high_zoom: 0.9
  park_outline: true
  park_outline_color: "#80b080"
  cemetery_color: "#c0ccb4"
  hospital_color: "#e8d0df"
  school_color: "#efdfb4"

# ── Buildings ────────────────────────────────────────────────────────────────
buildings:
  min_zoom: 14
  extrude: false
  height_multiplier: 1.0

# ── Water ────────────────────────────────────────────────────────────────────
water:
  river_min_width: 1.5
  river_min_zoom: 8
  stream_min_zoom: 12
  lake_outline: true

# ── Labels ───────────────────────────────────────────────────────────────────
labels:
  font: "Saira Regular"
  font_bold: "Saira Bold"
  font_italic: "Saira Italic"
  size_scale: 1.0
  halo_width: 1.5
  country_min_zoom: 2
  country_max_zoom: 6
  state_min_zoom: 4
  state_max_zoom: 9
  city_min_zoom: 4
  town_min_zoom: 8
  village_min_zoom: 11
  suburb_min_zoom: 13
  street_min_zoom: 15
  poi_min_zoom: 16

# ── Borders ──────────────────────────────────────────────────────────────────
borders:
  country_color: "#888888"
  country_width: 1.5
  country_dasharray: [5, 3]
  state_color: "#aaaaaa"
  state_width: 0.8
  state_dasharray: [3, 2]
  state_min_zoom: 4

# ── Terrain (hillshade + contours) ───────────────────────────────────────────
# Raster-DEM source from Mapterhorn (Terrarium encoding, WebP tiles).
# Hillshade is always on; contours are togglable client-side (see Map.svelte).
terrain:
  source:
    url: "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"
    encoding: "terrarium"
    tile_size: 512
    max_zoom: 12

  hillshade:
    opacity: 0.35
    shadow_color: "#4a3a2a"       # warm dark brown, blends with palette
    highlight_color: "#ffffff"
    accent_color: "#00000000"     # transparent — MapLibre default reads too blue
    exaggeration: 0.45
    illumination_direction: 335   # NW, slightly north of default

  contours:
    color_minor: "#8a6a3c"        # warm brown, minor lines
    color_major: "#6a4a24"        # deeper brown, major lines
    width_minor: 0.4
    width_major: 1.0
    opacity: 0.7
    label_color: "#4a3624"
    label_halo: "#f4ecdccc"       # halo tuned to background/farmland tones
    label_size: 10