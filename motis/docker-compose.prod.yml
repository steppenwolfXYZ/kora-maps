# Production MOTIS server (Hetzner CAX11, /var/www/koramaps.app/motis/).
# Serve-only: the GTFS/OSM import runs on the local Mac (see
# docker-compose.yml + scripts/preprocess_gtfs_for_motis.py), the server
# receives just the prebuilt indexes in ./data via scripts/deploy_motis.sh.
# Verified locally: /motis server starts and serves with only config.yml +
# data/ mounted — the import-only paths in config.yml are ignored at
# serve time, so no trimmed config.prod.yml is needed.
#
# Runs the Kora fork of MOTIS. The image tag must match what
# scripts/deploy_motis.sh pushes — build locally with:
#   docker build -t koramaps/motis:footpath-matrix -f motis/fork/Dockerfile motis/fork
#   docker save koramaps/motis:footpath-matrix | ssh koramaps 'docker load'
# (see .claude/rules/deployment.md § MOTIS deploy).
services:
  motis:
    image: koramaps/motis:footpath-matrix
    container_name: kora-motis
    ports:
      # Loopback only — nginx is the sole client (location /routing/).
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yml:/data/config.yml:ro
      - ./data:/data/data
    environment:
      # Serve-time containers do not read this — the transfer table is
      # already baked into tt_ext.bin by import. Kept for parity with
      # docker-compose.yml so a manual `docker compose run motis-import`
      # on the server (should we ever do that) would work.
      KORA_FOOTPATH_MATRIX_PATH: /data/data/valhalla_footpath_matrix.csv
      # Query-time Valhalla endpoint (WALK offsets + WALK legs). Shared
      # `koramaps` docker network — one-time server prep:
      #   docker network create koramaps
      # The fork's server aborts at startup while Valhalla is down;
      # `restart: unless-stopped` retries until it is up.
      KORA_VALHALLA_URL: http://kora-valhalla:8002
    working_dir: /data
    command: ["/motis", "server"]
    restart: unless-stopped
    networks: [koramaps]
    # RAM budget on the shared CAX11 (4 GB total): 2 GB for MOTIS, the rest
    # for nginx + the SvelteKit app + Valhalla + system. MOTIS memory-maps
    # its indexes, so pressure mostly evicts clean page cache rather than
    # OOM-killing.
    mem_limit: 2g
    # Cap container logs (json-file driver) — unbounded logs would slowly
    # eat the CAX11's disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  koramaps:
    external: true
