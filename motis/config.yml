server:
  host: 0.0.0.0
  port: 8080

osm: /data/osm.pbf

timetable:
  # Fixed start date, not TODAY — with TODAY, every re-import advances the
  # window forward, and any bookmarked / shared URL with a past date falls
  # outside the window and starts erroring `[VERIFY FAIL] query time … is
  # outside of loaded timetable window`. Anchor at the start of the Swiss
  # 2026 timetable cycle instead (opentransportdata calendar.txt runs
  # 2025-12-14 → 2026-12-12; 2026-01-01 is a clean round anchor). Bump this
  # forward when the feed rolls over to the next annual cycle.
  first_day: 2026-01-01
  # 400 days = through 2027-02-04, covering the full 2026 cycle plus buffer
  # into the 2027 cycle if the pipeline pulls it before we bump first_day.
  num_days: 400
  with_shapes: true
  # Allow up to 2 h walking transfers between transit legs — the default
  # (15 min) prevents non-official walking connections that route users
  # want when they help find a faster or otherwise-useful option.
  max_footpath_length: 120
  datasets:
    ch:
      path: /data/gtfs

street_routing: true

geocoding: false

# Raise walking hard caps. Defaults are 60 min pre/post transit and
# 6 h direct — both clipped short here. Lift to 8 h so remote clicks
# can walk in and out of the transit graph on the real OSM network
# rather than being teleported (or refused) by the router.
limits:
  street_routing_max_prepost_transit_seconds: 28800
  street_routing_max_direct_seconds: 28800
