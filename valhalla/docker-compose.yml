# Local Valhalla pedestrian router (Switzerland + neighbours).
#
# Valhalla is the sole walking authority (see
# .claude/concepts/valhalla-pedestrian-router.md). It powers:
#   - direct walk-only itineraries surfaced to the user
#   - pre/post-transit walk legs shown in transit results
#   - the stop-to-stop footpath matrix that seeds MOTIS's RAPTOR
#     transfer table (see scripts/build_valhalla_footpath_matrix.py
#     and the MOTIS fork's `footpath_matrix` config key)
#
# The gis-ops docker-valhalla image bootstraps everything:
#   - on first `up` with only the PBF present it downloads SRTM
#     1-arcsec elevation for the PBF's bbox, builds admin polygons,
#     then builds the routing tiles under ./data/valhalla_tiles/
#   - on later `up` calls with unchanged inputs it skips straight to
#     serving on :8002
#
# The same MOTIS-preprocessed PBF is reused so alp / forest roads
# route for pedestrians on both engines (see
# scripts/preprocess_osm_for_motis.py).
services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: kora-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./data:/custom_files
      # Mount the pipeline-bboxed multi-country PBF with foot=yes
      # patches (see scripts/preprocess_osm_for_motis.py --valhalla).
      # CH-only would leave every cross-border GTFS stop (Basel Bad,
      # Konstanz, Domodossola, Weil am Rhein, …) unroutable, poisoning
      # the transfer matrix. The wider bbox covers CH + DE + FR + IT +
      # AT + LI within the pipeline's routing area.
      - ../data/osm/ch_pfaedle_walkable.osm.pbf:/custom_files/ch_pfaedle_walkable.osm.pbf:ro
      # pam limits override — see nofile.conf for why --ulimit alone is
      # not enough in this image.
      - ./nofile.conf:/etc/security/limits.d/99-nofile.conf:ro
    environment:
      # tile_urls is empty because we build from the PBF locally,
      # not download prebuilt tiles from some CDN.
      - tile_urls=
      # After the first successful build, ignore the PBF and reuse
      # the tiles under valhalla_tiles/ so restarts are instant.
      - use_tiles_ignore_pbf=True
      # Only rebuild tiles / elevation on explicit request — a
      # rebuild is a 10-30 min operation.
      - force_rebuild=False
      - force_rebuild_elevation=False
      # SRTM 1-arcsec elevation for slope-aware pedestrian cost.
      - build_elevation=True
      - build_admins=True
      # Admin polygons are enough; time zones are not needed for
      # pedestrian routing (Valhalla only uses them for transit).
      - build_time_zones=False
      # Serving pool. VALHALLA_THREADS (env) sets it per machine — the
      # footpath-matrix builder saturates every thread here, so it should
      # follow the core count (setup_routing.sh exports nproc on Linux;
      # the 8 default fits the dev Mac). Bump MATRIX_WORKERS alongside
      # so both sides scale together. Going past ~16 needs the fd-limit
      # fix below (nofile.conf) or valhalla_service dies at startup.
      - server_threads=${VALHALLA_THREADS:-8}
      # After build, serve on :8002.
      - serve_tiles=True
    # Raises the container's hard/soft fd limits; nofile.conf (mounted
    # above) is what makes the soft limit survive the entrypoint's sudo.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    restart: unless-stopped
    # Shared network with the MOTIS fork (query-time WALK routing —
    # MOTIS resolves this container as `kora-valhalla`). One-time:
    #   docker network create koramaps
    networks: [koramaps]

networks:
  koramaps:
    external: true
