# Mounted into the Valhalla container at /etc/security/limits.d/.
# The image's entrypoint drops to the `valhalla` user via sudo, which
# re-applies pam limits and resets the fd soft limit to 1024 regardless
# of docker's --ulimit. Each server thread holds tile fds + IPC sockets,
# so above ~16 threads valhalla_service dies at startup with "Too many
# open files" (ipc_listener.cpp). This lifts the pam default so
# VALHALLA_THREADS can follow the machine's core count.
* soft nofile 65536
* hard nofile 1048576
root soft nofile 65536
root hard nofile 1048576
